<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Comparison</title>
    <style>
        :root {
            color-scheme: light;
            --accent: #433c78;
            --accent-dark: #302956;
            --ink: #252a32;
            --line: #d7dce2;
            --panel: #f0f3f6;
            --task-panel: #e2e6eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .experiment {
            display: grid;
            grid-template-columns: minmax(280px, 32.2%) minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .task {
            padding: 20px;
            background: var(--task-panel);
        }

        .task-title {
            margin: 0 0 7px;
            color: var(--accent);
            font-size: 16px;
        }

        .task-description {
            margin: 0;
            line-height: 1.65;
        }

        .response {
            padding: 20px;
        }

        .answer-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .required {
            color: #b42335;
        }

        .answer-input {
            width: 100%;
            height: 42px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            box-shadow: 0 1px 2px rgb(20 30 45 / 8%);
        }

        .answer-input::placeholder {
            color: #a0a8b1;
        }

        .answer-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(67 60 120 / 15%);
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .button-red {
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: #df4756;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .button-primary {
            background: var(--accent);
            color: #fff;
        }

        .button-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .button:disabled {
            color: #aeb6bf;
            cursor: not-allowed;
        }

        .button-primary:disabled {
            border-color: #e1e4e8;
            background: #e1e4e8;
            color: #9da5ae;
        }

        .visualization {
            min-width: 0;
            padding: 30px 34px;
            overflow: auto;
        }

        #chart svg {
            display: block;
            max-width: 100%;
            height: auto;
            margin-bottom: 24px;
        }

        #test-values {
            margin-top: 12px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .experiment {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(360px, 1fr);
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .task {
                padding: 18px 20px;
            }

            .response {
                padding: 16px 20px 18px;
            }

            .button-row {
                margin-top: 12px;
            }

            .visualization {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="experiment">
        <aside class="sidebar" aria-label="Task and response">
            <section class="task" aria-labelledby="task-title">
                <h1 class="task-title" id="task-title">Task:</h1>
                <p class="task-description" id="task-description"></p>
            </section>

            <div class="response" id="answer-box">
                <label class="answer-label" for="answer">
                    Answer: <span class="required" aria-hidden="true">*</span>
                </label>
                <input
                    class="answer-input"
                    id="answer"
                    name="answer"
                    type="number"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="1-100"
                >
                <div class="button-row">
                    <button class="button-red" id="submit-early" type="button">
                        Submit Early
                    </button>
                    <button class="button" id="next-question" type="button">
                        Next
                    </button>
                    <button class="button" id="exit-experiment" type="button" hidden>
                        Exit
                    </button>
                </div>
            </div>
        </aside>

        <section class="visualization" aria-label="Value visualization">
            <div id="chart"></div>
            <div id="test-values"></div>
        </section>
    </main>
    <script type="module">

        import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
        import { addResponses } from './supabase.js';

        function createSquares(dataset, targetIndices, width, height) {
            const root = d3.hierarchy({
                children: dataset.map(value => ({ value }))
            }).sum(d => d.value);
            d3.pack().size([width, height]).padding(2)(root);
            const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
            svg.selectAll("rect")
                .data(root.leaves()).enter()
                .append("rect")
                .attr("x", d => d.x - d.r / Math.sqrt(2))
                .attr("y", d => d.y - d.r / Math.sqrt(2))
                .attr("width", d => d.r * Math.sqrt(2))
                .attr("height", d => d.r * Math.sqrt(2))
                .attr("fill", "white")
                .attr("stroke", "black")
                .attr("stroke-width", Math.min(width, height) / 500);
            svg.selectAll("path")
                .data(root.leaves().filter((d, i) => targetIndices.includes(i))).enter()
                .append("path")
                .attr("d", d3.symbol().type(d3.symbolTriangle).size(Math.min(width, height) / 4))
                .attr("transform", d => `translate(${d.x}, ${d.y - d.r / Math.sqrt(2) - Math.sqrt(Math.min(width, height) / (Math.sqrt(3) * 2))}) rotate(180)`)
                .attr("fill", "black");
        }
        function createScatter(dataset, targetIndices, margin, width, height) {
            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");
            // Add X Axis
            var x = d3.scaleLinear()
                .domain([0, 100])
                .range([0, width]);
            const xAxis = d3.axisBottom(x)
                .ticks(1);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis);
            // Add Y axis
            var y = d3.scaleLinear()
                .domain([0, 0])
                .range([height, 0]);
            const yAxis = d3.axisLeft(y)
                .ticks(0);
            svg.append("g")
                .call(yAxis);
            // Add dots
            svg.append('g')
                .selectAll("dot")
                .data(dataset)
                .enter()
                .append("circle")
                .attr("cx", function (d) { return x(d.x); })
                .attr("cy", function (d) { return y(d.y); })
                .attr("r", (d, i) => targetIndices.includes(i) ? 5 : 3)
                .style("fill", (d, i) => targetIndices.includes(i) ? "#000000" : "#ffffff")
                .style("stroke", "#000000");
        }
        function createBar(dataset, targetIndices, margin, width, height) {
            // Create SVG
            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom);
            const g = svg.append("g")
                .attr("transform", `translate(${margin.left}, ${margin.top})`);
            // Y scale
            const yScale = d3.scaleLinear()
                .domain([0, 100])
                .range([height, 0]);
            // X scale
            const xScale = d3.scaleLinear()
                .domain([0, 1])
                .range([0, width]);
            // Y axis
            g.append("g")
                .call(d3.axisLeft(yScale).tickValues([0, 100]));

            // X axis
            g.append("g")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(xScale).tickValues([]));

            // Convert normalized values into vertical positions
            let total = 0;
            const blocks = dataset.map((value, index) => {
                const block = {
                    index: index,
                    value: value,
                    start: total,
                    end: total + value
                };
                total += value;
                return block;
            });
            // Draw the 5 blocks
            g.selectAll(".block")
                .data(blocks)
                .enter()
                .append("rect")
                .attr("class", "block")
                .attr("x", width / 2 - 170 / 2)
                .attr("y", d => yScale(d.end))
                .attr("width", 170)
                .attr("height", d => yScale(d.start) - yScale(d.end))
                .attr("fill", "white")
                .attr("stroke", "black")
                .attr("stroke-width", 1.5);
            // Add black dots to the two selected blocks
            g.append("g")
                .selectAll("dot")
                .data(blocks.filter(d => targetIndices.includes(d.index)))
                .enter()
                .append("circle")
                .attr("cx", width / 2)
                .attr("cy", d => yScale((d.start + d.end) / 2))
                .attr("r", 4)
                .style("fill", "#000000");
            return blocks;
        }
        try {
            // TRIAL DATA STORAGE
            const TOTAL_TRIALS = 60;
            const numValues = 5;
            // Three arrays storing experiment results
            // ---------------------------------------------------------The stuff for backend
            const chartTypes = [];
            const truePercentages = [];
            const userPercentages = [];
            //---------------------------------------------------------The stuff for backend
            let currentChartType;
            let currentTruePercentage;
            // Chart dimensions
            const width = Math.min(500, window.innerWidth);
            const height = width;
            const margin = {
                top: 30,
                right: 30,
                bottom: 50,
                left: 60
            };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            const answerInput = document.getElementById("answer");
            const nextButton = document.getElementById("next-question");
            const submitEarlyButton = document.getElementById("submit-early");  
            const exitButton = document.getElementById("exit-experiment");

            // Show average response differences for each chart type
            function showSummary(trialCount) {
                const summaries = [
                    { type: "dot", label: "Dot chart" },
                    { type: "bar", label: "Bar chart" },
                    { type: "square", label: "Square chart" }
                ];

                d3.select("#task-title").text("Experiment Summary:");
                d3.select("#task-description").text(
                    `Thank you for completing ${trialCount} trials! Your scores have been saved. Average differences from the true percentage:`
                );
                d3.select("#test-values").html("");

                summaries.forEach(summary => {
                    const matchingTrials = chartTypes
                        .map((chartType, index) => ({
                            chartType,
                            difference: userPercentages[index] - truePercentages[index]
                        }))
                        .filter(trial => trial.chartType === summary.type);

                    const averageDifference = matchingTrials.length
                        ? matchingTrials.reduce((total, trial) => total + trial.difference, 0) / matchingTrials.length
                        : 0;
                    const roundedDifference = Math.abs(averageDifference).toFixed(1);
                    let comparison;

                    if (averageDifference > 0.05) {
                        comparison = `you answered ${roundedDifference}% higher than the true percentage`;
                    } else if (averageDifference < -0.05) {
                        comparison = `you answered ${roundedDifference}% lower than the true percentage`;
                    } else {
                        comparison = "you answered about the same as the true percentage";
                    }

                    d3.select("#test-values")
                        .append("p")
                        .style("margin", "6px 0")
                        .text(`${summary.label}: ${comparison}.`);
                });

                answerInput.disabled = true;
                nextButton.disabled = true;
                exitButton.hidden = false;
            }
            // CREATE CHART SCHEDULE (ONLY ONCE)
            const chartSchedule = [
              ...Array(20).fill("dot"),
              ...Array(20).fill("bar"),
              ...Array(20).fill("square")
            ];
            // Shuffle the 60 charts once
            d3.shuffle(chartSchedule);
            // Make a new trial
            function generateTrial() {
                // Clear previous graph
                d3.select("#chart").selectAll("*").remove();
                // Select chart based on current trial
                const trialIndex = userPercentages.length;
                currentChartType = chartSchedule[trialIndex];
                // Generate random dataset
                const dataset = [];
                const randomUni = d3.randomUniform(1, 100);
                // Randomly choose two values
                const chosenIndices = d3.shuffle(
                  d3.range(numValues)
                ).slice(0, 2);
                // Minimum spacing for dot plots
                const minSpacingPx = 12;
                const maxDotRadius = 5;
                const minValueSpacing = ((2 * maxDotRadius + minSpacingPx) / chartWidth) * 100;
                // Keep the marked dots in a bar chart at least as visually separated
                // as the dots in the scatter plot.
                let normalizedDataset;
                let blockMidpoints;
                do {
                  dataset.length = 0;
                  while (dataset.length < numValues) {
                    const candidate = randomUni();
                    if (dataset.every(value => Math.abs(value - candidate) >= minValueSpacing)) {
                      dataset.push(candidate);
                    }
                  }
                  // Normalize data
                  const sum = dataset.reduce((a, b) => a + b, 0);
                  normalizedDataset = dataset.map(value => (value / sum) * 100);

                  let cumulativeValue = 0;
                  blockMidpoints = normalizedDataset.map(value => {
                    const start = cumulativeValue;
                    cumulativeValue += value;
                    return (start + cumulativeValue) / 2;
                  });
                } while (
                  currentChartType === "bar" &&
                  Math.abs(
                    blockMidpoints[chosenIndices[0]] -
                    blockMidpoints[chosenIndices[1]]
                  ) * chartHeight / 100 <
                  2 * maxDotRadius + minSpacingPx
                );
                // Calculate correct percentage
                const selectedValues = chosenIndices.map(i => normalizedDataset[i]);
                const smaller = Math.min(...selectedValues);
                const larger = Math.max(...selectedValues);
                currentTruePercentage = (smaller / larger) * 100;
                // DRAW SELECTED CHART
                if (currentChartType === "dot"){
                  const sharedY = randomUni();
                  const scatterData = dataset.map(x => ({x: x, y: sharedY}));
                  createScatter(scatterData, chosenIndices, margin, chartWidth, chartHeight);
                  d3.select("#task-description")
                    .text("Two values are marked with dots. \n Based on the positions of the marked dots along the horizontal scale, what percentage is the smaller value of the larger value?");
                }
                else if (currentChartType === "bar"){
                  createBar(normalizedDataset, chosenIndices, margin, chartWidth, chartHeight);
                  d3.select("#task-description")
                    .text("Two values are marked with dots. \n Based on the heights of the marked sections, what percentage is the smaller value of the larger value?");
                }
                else if (currentChartType === "square"){
                  createSquares(dataset, chosenIndices, chartWidth, chartHeight);
                  d3.select("#task-description")
                    .text("Two values are marked with triangles. \n Based on the areas of the marked squares, what percentage is the smaller value of the larger value?");
                }
                // Update trial progress
                d3.select("#test-values").text(`Graph ${trialIndex + 1} / ${TOTAL_TRIALS}`);
                // Clear previous answer
                answerInput.value = "";
                // Debug information
                console.log("Trial:", trialIndex + 1);
                console.log("Chart:", currentChartType);
                console.log("Correct percentage:", currentTruePercentage);
            }
            // NEXT BUTTON
            nextButton.addEventListener("click", function () {
                const userAnswer = Number(answerInput.value);
                // Validate answer
                if (answerInput.value.trim() === "" || !Number.isFinite(userAnswer) || userAnswer < 1 || userAnswer > 100) {
                    alert("Please enter a percentage between 1 and 100.");
                    return;
                }
                // Store trial results
                chartTypes.push(currentChartType);
                truePercentages.push(currentTruePercentage);
                userPercentages.push(userAnswer);
                // Print arrays
                console.log("Chart Types:", chartTypes);
                console.log("True Percentages:", truePercentages);
                console.log("User Percentages:", userPercentages);
                // CHECK EXPERIMENT COMPLETION
                if (userPercentages.length === TOTAL_TRIALS) {
                    d3.select("#chart").selectAll("*").remove();
                    d3.select("#test-values")
                        .text("Experiment completed! You finished all 60 trials.");
                    answerInput.disabled = true;
                    nextButton.disabled = true;
                    submitEarlyButton.remove();

                    showSummary(TOTAL_TRIALS);

                    // Save data 
                    addResponses(chartTypes, truePercentages, userPercentages)
                        .then(result => {
                            console.log("Data saved successfully:", result);
                        })
                        .catch(error => {
                            console.error("Error saving data:", error);
                        });

                    return;
                }
                // Generate next graph
                generateTrial();
            });

            // SUBMIT EARLY BUTTON
            submitEarlyButton.addEventListener("click", function () {
                if (!confirm("Finish early? Your test will end early and your current progress will be submitted.")) {
                    return;
                }

                // Save current answer if valid
                const userAnswer = Number(answerInput.value);
                if (answerInput.value.trim() !== "" && Number.isFinite(userAnswer) && userAnswer >= 1 && userAnswer <= 100) {
                    chartTypes.push(currentChartType);
                    truePercentages.push(currentTruePercentage);
                    userPercentages.push(userAnswer);
                }

                // Save responses
                addResponses(chartTypes, truePercentages, userPercentages)
                    .then(result => {
                        console.log("Data saved successfully:", result);
                    })
                    .catch(error => {
                        console.error("Error saving data:", error);
                    });

                // Display summary based on completed trials
                d3.select("#chart").selectAll("*").remove();
                d3.select("#test-values").text("Experiment submitted early.");

                answerInput.disabled = true;
                nextButton.disabled = true;
                submitEarlyButton.disabled = true;

                showSummary(userPercentages.length);
            });

            // Confirm before exiting the experiment
            exitButton.addEventListener("click", function () {
                if (!confirm("Thank you for participating! Your answers have been saved for analysis. Once you leave this page, you will not be able to view your individual results again.")) {
                    return;
                }

                window.location.href = "index.html";
            });
            // START EXPERIMENT
            generateTrial();
        } catch (err) {
            console.error("Error generating random data:", err);
            d3.select("#test-values").text(`Unable to render the graphs: ${err.message}`);
        }
    </script>
</body>
</html>
