<!DOCTYPE html>
<div id="container"></div>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

try {
    const numValues = 5;

    const randomUni = d3.randomUniform(0, 100);

    const chosenValues = d3.shuffle(d3.range(numValues)).slice(0, 2);

    const dataset = Array.from({ length: numValues }, () => randomUni());
    
    console.log("Random Dataset:", dataset);

    // displays in browser change this
    d3.select("body")
      .selectAll("p")
      .data(dataset)
      .enter()
      .append("p")
      .html((d, i) => 
        chosenValues.includes(i)
          ? `<b>Value: ${d.toFixed(2)}</b>`
          : `Value: ${d.toFixed(2)}`
      );

  } catch (err) {
    console.error("Error generating random data:", err)
}

</script>
