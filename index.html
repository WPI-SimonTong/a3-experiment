<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Comparison</title>
    <style>
        :root {
            color-scheme: light;
            --accent: #433c78;
            --accent-dark: #302956;
            --ink: #252a32;
            --line: #d7dce2;
            --panel: #f0f3f6;
            --task-panel: #e2e6eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .experiment {
            display: grid;
            grid-template-columns: minmax(280px, 32.2%) minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .task {
            padding: 20px;
            background: var(--task-panel);
        }

        .task-title {
            margin: 0 0 7px;
            color: var(--accent);
            font-size: 16px;
        }

        .task-description {
            margin: 0;
            line-height: 1.65;
        }

        .response {
            padding: 20px;
        }

        .answer-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .required {
            color: #b42335;
        }

        .answer-input {
            width: 100%;
            height: 42px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            box-shadow: 0 1px 2px rgb(20 30 45 / 8%);
        }

        .answer-input::placeholder {
            color: #a0a8b1;
        }

        .answer-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(67 60 120 / 15%);
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .button-primary {
            background: var(--accent);
            color: #fff;
        }

        .button-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .button:disabled {
            color: #aeb6bf;
            cursor: not-allowed;
        }

        .button-primary:disabled {
            border-color: #e1e4e8;
            background: #e1e4e8;
            color: #9da5ae;
        }

        .visualization {
            min-width: 0;
            padding: 30px 34px;
            overflow: auto;
        }

        #chart svg {
            display: block;
            max-width: 100%;
            height: auto;
            margin-bottom: 24px;
        }

        #test-values {
            margin-top: 12px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .experiment {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(360px, 1fr);
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .task {
                padding: 18px 20px;
            }

            .response {
                padding: 16px 20px 18px;
            }

            .button-row {
                margin-top: 12px;
            }

            .visualization {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="experiment">
        <aside class="sidebar" aria-label="Task and response">
            <section class="task" aria-labelledby="task-title">
                <h1 class="task-title" id="task-title">Task:</h1>
                <p class="task-description">
                    Two values are marked with dots. What percentage do you believe the
                    smaller value represents relative to the larger value?
                </p>
            </section>

            <div class="response" id="answer-box">
                <label class="answer-label" for="answer">
                    Answer: <span class="required" aria-hidden="true">*</span>
                </label>
                <input
                    class="answer-input"
                    id="answer"
                    name="answer"
                    type="number"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="0-100"
                >
                <div class="button-row">
                    <button class="button button-primary" id="check-answer" type="button" disabled>
                        Check Answer
                    </button>
                    <label class="correctness" for="answer">
                        <hidden></hidden>
                    </label>
                    <button class="button" id="next-question" type="button" disabled>
                        Next
                    </button>
                </div>
            </div>
        </aside>

        <section class="visualization" aria-label="Value visualization">
            <div id="chart"></div>
            <div id="test-values"></div>
        </section>
    </main>

    <script type="module">

        import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

        function createSquares(dataset, targetIndices, width, height) {
            const root = d3.hierarchy({
                children: dataset.map(value => ({ value }))
            }).sum(d => d.value);

            d3.pack()
                .size([width, height])
                .padding(2)(root);

            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            svg.selectAll("rect")
                .data(root.leaves())
                .enter()
                .append("rect")
                .attr("x", d => d.x - d.r / Math.sqrt(2))
                .attr("y", d => d.y - d.r / Math.sqrt(2))
                .attr("width", d => d.r * Math.sqrt(2))
                .attr("height", d => d.r * Math.sqrt(2))
                .attr("fill", "white")
                .attr("stroke", "black")
                .attr("stroke-width", Math.min(width, height) / 500);

            svg.selectAll("path")
                .data(root.leaves().filter((d, i) => targetIndices.includes(i)))
                .enter()
                .append("path")
                .attr("d", d3.symbol().type(d3.symbolTriangle).size(Math.min(width, height) / 4))
                .attr("transform", d => `translate(${d.x}, ${d.y - d.r / Math.sqrt(2) - Math.sqrt(Math.min(width, height) / (Math.sqrt(3) * 2))}) rotate(180)`)
                .attr("fill", "black");
        }

        function createScatter(dataset, targetIndices, margin, width, height) {
            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Add X Axis
            var x = d3.scaleLinear()
                .domain([0, 100])
                .range([0, width]);
            const xAxis = d3.axisBottom(x)
                .ticks(1);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis);

            // Add Y axis
            var y = d3.scaleLinear()
                .domain([0, 0])
                .range([height, 0]);
            const yAxis = d3.axisLeft(y)
                .ticks(0);
            svg.append("g")
                .call(yAxis);

            // Add dots
            svg.append('g')
                .selectAll("dot")
                .data(dataset)
                .enter()
                .append("circle")
                .attr("cx", function (d) { return x(d.x); })
                .attr("cy", function (d) { return y(d.y); })
                .attr("r", (d, i) => targetIndices.includes(i) ? 5 : 3)
                .style("fill", (d, i) => targetIndices.includes(i) ? "#000000" : "#ffffff")
                .style("stroke", "#000000");
        }

        function createBar(dataset, targetIndices, margin, width, height) {
            // Create SVG
            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom);

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left}, ${margin.top})`);

            // Y scale
            const yScale = d3.scaleLinear()
                .domain([0, 100])
                .range([height, 0]);

            // X scale
            const xScale = d3.scaleLinear()
                .domain([0, 1])
                .range([0, width]);

            // Y axis
            g.append("g")
                .call(d3.axisLeft(yScale).tickValues([0, 100]));

            // X axis
            g.append("g")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(xScale).tickValues([]));

            // Convert normalized values into vertical positions
            let total = 0;

            const blocks = dataset.map((value, index) => {
                const block = {
                    index: index,
                    value: value,
                    start: total,
                    end: total + value
                };
                total += value;
                return block;
            });


            // Draw the 5 blocks
            g.selectAll(".block")
                .data(blocks)
                .enter()
                .append("rect")
                .attr("class", "block")
                .attr("x", width / 2 - 170 / 2)
                .attr("y", d => yScale(d.end))
                .attr("width", 170)
                .attr("height", d => yScale(d.start) - yScale(d.end))
                .attr("fill", "white")
                .attr("stroke", "black")
                .attr("stroke-width", 1.5);

            // Add black dots to the two selected blocks
            g.append("g")
                .selectAll("dot")
                .data(blocks.filter(d => targetIndices.includes(d.index)))
                .enter()
                .append("circle")
                .attr("cx", width / 2)
                .attr("cy", d => yScale((d.start + d.end) / 2))
                .attr("r", 4)
                .style("fill", "#000000");

            return blocks;
        }

        try {
            // Chart dimensions
            const width = 500;
            const height = 500;
            const margin = { top: 30, right: 30, bottom: 50, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;

            // Normal Data
            const dataset = [];
            const numValues = 5;
            const randomUni = d3.randomUniform(0, 100);
            const chosenValues = d3.shuffle(d3.range(numValues)).slice(0, 2);

            // Minimum Spacing for scatter dot plots
            const minSpacingPx = 12;
            const maxDotRadius = 5;
            const minValueSpacing =
                ((2 * maxDotRadius + minSpacingPx) / chartWidth) * 100;


            while (dataset.length < numValues) {
                const candidate = randomUni();

                if (dataset.every(value =>
                    Math.abs(value - candidate) >= minValueSpacing
                )) {
                    dataset.push(candidate);
                }
            }
            console.log("Random Dataset:", dataset);

            // Scatter Plot Shared Y Data
            const sharedY = randomUni();
            const scatter_data = dataset.map(x => ({ x, y: sharedY }));

            // Normalize data
            const sum = dataset.reduce((a, b) => a + b, 0);
            const normalizedDataset = dataset.map(v => (v / sum) * 100);

            // Target Indicies / Pairs
            const chosenIndices = chosenValues;
            const selectedValues = chosenIndices.map(i => normalizedDataset[i]);
            const smaller = Math.min(...selectedValues);
            const larger = Math.max(...selectedValues);
            const answer = (smaller / larger) * 100;

            createSquares(dataset, chosenIndices, chartWidth, chartHeight);
            createScatter(scatter_data, chosenIndices, margin, chartWidth, chartHeight);
            const blocks = createBar(normalizedDataset, chosenIndices, margin, chartWidth, chartHeight);

            // Print testing information
            console.log("Block values:", normalizedDataset);
            console.log("Selected blocks:", chosenIndices);
            console.log("Correct answer:", Math.round(answer) + "%");

            // Display actual values for testing only
            d3.select("#test-values").html(`
      <b>TESTING ONLY - Actual block values listed from bottom to top:</b><br>
      ${blocks.map(d =>
                `Block ${d.index + 1}: ${Math.round(d.value)}%`
            ).join("<br>")}
      <br><b>Selected blocks:</b> ${chosenIndices.map(i => i + 1).join(", ")}
      <br><b>Correct answer:</b> ${Math.round(answer)}%
    `);

        } catch (err) {
            console.error("Error generating random data:", err);
            d3.select("#test-values")
                .text(`Unable to render the graphs: ${err.message}`);
        }

        function showOneGraph() {

        }

        function checkAnswer() {
            onclick() 
        }

    </script>
</body>
</html>
