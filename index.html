<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <style>
        :root {
            color-scheme: light;
            --accent: #433c78;
            --accent-dark: #302956;
            --ink: #252a32;
            --line: #d7dce2;
            --panel: #f0f3f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .homepage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .content {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            text-align: center;
        }

        h1 {
            margin: 0 0 16px;
            color: var(--accent);
            font-size: 28px;
        }

        .description {
            margin: 0;
            line-height: 1.65;
        }

        .button-row {
            margin-top: 28px;
        }

        .button {
            min-height: 42px;
            padding: 0 22px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: var(--accent-dark);
        }

        .button-secondary {
            background: #fff;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .button-secondary:hover {
            background: var(--panel);
        }

        @media (max-width: 640px) {
            .content {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="homepage">
        <section class="content">
            <h1>Cleveland-McGill Experiment</h1>

            <p class="description">
                This test is designed to mimic the Cleveland-McGill experiment which was a study on how well people can interpret data presented in different visual formats.
            </p>

            <div class="button-row">
                <button class="button" type="button" onclick="window.location.href='examples.html'">
                    Take Test
                </button>
            </div>

            <div class="button-row">
                <button class="button button-secondary" type="button" onclick="alert('No analysis available yet.')">
                    View Results
                </button>
            </div>
        </section>
    </main>
</body>
</html>
