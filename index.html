<!DOCTYPE html>
<div id="container"></div>
<script type="module">

    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    try {
        const randomUni = d3.randomUniform(0, 100);

        const sharedY = randomUni();
        const dataset = Array.from({ length: 5 }, () => ({
            x: randomUni(),
            y: sharedY
        }));

        var margin = { top: 10, right: 30, bottom: 30, left: 60 },
            width = 460 - margin.left - margin.right,
            height = 400 - margin.top - margin.bottom;

        const svg = d3.select("#container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform",
                "translate(" + margin.left + "," + margin.top + ")");

        function scatterPlot(dataset) {

            // Add X Axis
            var x = d3.scaleLinear()
                .domain([0, 100])
                .range([0, width]);
            const xAxis = d3.axisBottom(x)
                .ticks(1);
            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis);

            // Add Y axis
            var y = d3.scaleLinear()
                .domain([0, 100])
                .range([height, 0]);
            const yAxis = d3.axisLeft(y)
                .ticks(1);
            svg.append("g")
                .call(yAxis);

            // Add dots
            svg.append('g')
                .selectAll("dot")
                .data(dataset)
                .enter()
                .append("circle")
                .attr("cx", function (d) { return x(d.x); })
                .attr("cy", function (d) { return y(d.y); })
                .attr("r", 4)
                .style("fill", "#000000")
        }
        scatterPlot(dataset);
    } catch (err) {
        console.error("Error generating random data:", err)
    }

</script>
