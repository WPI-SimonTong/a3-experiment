<!DOCTYPE html>
<div id="container"></div>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function createSquares(data, targetIndices, width, height) {
  const root = d3.hierarchy({
    children: data.map(value => ({ value }))
  }).sum(d => d.value);

  d3.pack()
      .size([width, height])
      .padding(2)(root);

  const svg = d3.select("#container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

  svg.selectAll("rect")
      .data(root.leaves())
      .enter()
      .append("rect")
      .attr("x", d => d.x - d.r / Math.sqrt(2))
      .attr("y", d => d.y - d.r / Math.sqrt(2))
      .attr("width", d => d.r * Math.sqrt(2))
      .attr("height", d => d.r * Math.sqrt(2))
      .attr("fill", (d, i) => targetIndices.includes(i) ? "red" : "white")
      .attr("stroke", "black")
}

try {
    const numValues = 5;

    const randomUni = d3.randomUniform(0, 100);

    const chosenValues = d3.shuffle(d3.range(numValues)).slice(0, 2);

    const dataset = Array.from({ length: numValues }, () => randomUni());
    
    console.log("Random Dataset:", dataset);

    // displays in browser change this
    d3.select("body")
      .selectAll("p")
      .data(dataset)
      .enter()
      .append("p")
      .html((d, i) => 
        chosenValues.includes(i)
          ? `<b>Value: ${d.toFixed(2)}</b>`
          : `Value: ${d.toFixed(2)}`
      );

    createSquares(dataset, chosenValues, 500, 500);

  } catch (err) {
    console.error("Error generating random data:", err)
}

</script>
