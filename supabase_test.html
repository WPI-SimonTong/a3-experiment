<!--Example to test Supabase created with AI help-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supabase Response Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input, button {
            padding: 8px;
            margin: 4px;
        }

        .response {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .response input {
            width: 130px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #status {
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <h1>Supabase Response Tester</h1>

    <h2>Enter Responses</h2>

    <div id="inputs">
        <div class="response">
            <input placeholder="Visualization (e.g. bar)" class="vis">
            <input type="number" placeholder="True %" class="truePercent">
            <input type="number" placeholder="Reported %" class="reportedPercent">
        </div>
    </div>

    <button id="addTrial">Add Trial</button>
    <button id="save">Save Responses</button>

    <p id="status"></p>

    <h2>Saved Responses</h2>
    <button id="refresh">Refresh Data</button>

    <table>
        <thead>
            <tr>
                <th>Participant ID</th>
                <th>Trial #</th>
                <th>Visualization</th>
                <th>True %</th>
                <th>Reported %</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>

    <script type="module">
        import { addResponses, getResponses } from './supabase.js';

        document.getElementById('addTrial').addEventListener('click', () => {
            const row = document.createElement('div');
            row.className = 'response';
            row.innerHTML = `
                <input placeholder="Visualization" class="vis">
                <input type="number" placeholder="True %" class="truePercent">
                <input type="number" placeholder="Reported %" class="reportedPercent">
                <button type="button" class="remove">Remove</button>
            `;

            row.querySelector('.remove').addEventListener('click', () => row.remove());

            document.getElementById('inputs').appendChild(row);
        });

        document.getElementById('save').addEventListener('click', async () => {
            const status = document.getElementById('status');

            try {
                const rows = [...document.querySelectorAll('.response')];

                const vis = rows.map(row => row.querySelector('.vis').value.trim());
                const truePercent = rows.map(row => Number(row.querySelector('.truePercent').value));
                const reportedPercent = rows.map(row => Number(row.querySelector('.reportedPercent').value));

                if (rows.some((row, i) =>
                    !vis[i] ||
                    row.querySelector('.truePercent').value === '' ||
                    row.querySelector('.reportedPercent').value === ''
                )) {
                    throw new Error('Please fill in every field.');
                }

                const result = await addResponses(vis, truePercent, reportedPercent);

                status.textContent = `Saved ${result.data.length} responses. Participant ID: ${result.participantId}`;

                await displayResponses();
            } catch (error) {
                console.error(error);
                status.textContent = `Error: ${error.message}`;
            }
        });

        async function displayResponses() {
            const results = document.getElementById('results');
            results.textContent = '';

            const responses = await getResponses();

            responses.forEach(response => {
                const row = document.createElement('tr');

                [
                    response.participantId,
                    response.trialNum,
                    response.vis,
                    response.truePercent,
                    response.reportedPercent
                ].forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                results.appendChild(row);
            });
        }

        document.getElementById('refresh').addEventListener('click', async () => {
            try {
                await displayResponses();
                document.getElementById('status').textContent = 'Data refreshed.';
            } catch (error) {
                console.error(error);
                document.getElementById('status').textContent = `Error: ${error.message}`;
            }
        });

        displayResponses().catch(error => {
            console.error(error);
            document.getElementById('status').textContent = `Error loading data: ${error.message}`;
        });
    </script>
</body>
</html>
